<div class="min-h-screen bg-[#09090B] flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-[#121316] border border-zinc-800/80 rounded-3xl p-8 relative overflow-hidden shadow-2xl">
    
    <!-- Glow neón de fondo -->
    <div class="absolute -top-12 -right-12 w-36 h-36 bg-[#CCFF00]/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="mb-6">
      <span class="inline-block bg-[#CCFF00] text-black font-condensed font-black text-[10px] px-3 py-1 rounded-full uppercase tracking-wider mb-3">
        SETCONNECTION AUTH
      </span>
      <h1 class="font-condensed font-black text-3xl uppercase text-white tracking-tight">
        NUEVA CONTRASEÑA
      </h1>
      <p class="text-zinc-400 text-xs mt-1">
        Ingresa tu nueva clave para recuperar el acceso a tu cuenta.
      </p>
    </div>

    @if (isSuccess()) {
      <div class="bg-emerald-500/10 border border-emerald-500/30 p-4 rounded-2xl mb-6 text-center">
        <span class="text-2xl block mb-1">🎉</span>
        <h3 class="text-emerald-400 font-condensed font-bold text-sm uppercase">¡Contraseña Actualizada!</h3>
        <p class="text-zinc-400 text-xs mt-1">Ya puedes iniciar sesión con tu nueva clave.</p>
        
        <button 
          (click)="openLoginModal()"
          class="w-full mt-4 py-3 bg-[#CCFF00] text-black font-condensed font-bold text-xs uppercase tracking-wider rounded-full hover:bg-[#b8e600] transition-transform hover:scale-[1.01] cursor-pointer border-none">
          INICIAR SESIÓN AHORA ➔
        </button>
      </div>
    } @else {

      @if (errorMessage()) {
        <div class="mb-4 p-3 bg-red-500/10 border border-red-500/30 text-red-400 rounded-2xl text-xs font-medium">
          ⚠️ {{ errorMessage() }}
        </div>
      }

      <form (ngSubmit)="onSubmit()" class="space-y-4">
        <div>
          <label class="block text-[10px] font-condensed font-bold uppercase text-zinc-400 mb-1 tracking-wider">
            Nueva Contraseña
          </label>
          <input 
            type="password" 
            [(ngModel)]="newPassword" 
            name="newPassword"
            required
            placeholder="••••••••"
            class="w-full px-4 py-3 bg-zinc-900 border border-zinc-800 rounded-2xl text-xs font-medium text-white focus:outline-none focus:border-[#CCFF00] transition-colors" />
        </div>

        <div>
          <label class="block text-[10px] font-condensed font-bold uppercase text-zinc-400 mb-1 tracking-wider">
            Confirmar Nueva Contraseña
          </label>
          <input 
            type="password" 
            [(ngModel)]="confirmPassword" 
            name="confirmPassword"
            required
            placeholder="••••••••"
            class="w-full px-4 py-3 bg-zinc-900 border border-zinc-800 rounded-2xl text-xs font-medium text-white focus:outline-none focus:border-[#CCFF00] transition-colors" />
        </div>

        <button 
          type="submit"
          [disabled]="isLoading() || !token()"
          class="w-full mt-2 py-3.5 bg-white text-black font-condensed font-bold text-xs uppercase tracking-wider rounded-full hover:bg-zinc-200 transition-transform hover:scale-[1.01] cursor-pointer border-none disabled:opacity-50">
          @if (isLoading()) { ACTUALIZANDO... }
          @else { RESTABLECER CONTRASEÑA ➔ }
        </button>
      </form>
    }

  </div>
</div>
