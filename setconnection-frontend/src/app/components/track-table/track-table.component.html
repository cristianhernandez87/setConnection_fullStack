<div *ngIf="tracks().length > 0" class="mt-6 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
  <h3 class="mb-4 text-base font-bold text-slate-900">🎵 Tracks Identificados</h3>

  <div class="overflow-x-auto">
    <table class="w-full text-left text-sm">
      <thead class="border-b border-slate-200 text-xs uppercase text-slate-500">
        <tr>
          <th class="py-2.5 pr-4">Track</th>
          <th class="py-2.5 px-4">Artista</th>
          <th class="py-2.5 pl-4 text-right">Estado</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-100 text-slate-800">
        @for (track of tracks(); track $index) {
          <tr>
            <td class="py-3 pr-4 font-semibold text-slate-900">{{ track.title }}</td>
            <td class="py-3 px-4 text-slate-600">{{ track.artist || 'Desconocido' }}</td>
            <td class="py-3 pl-4 text-right">
              <span class="rounded-full border border-emerald-200 bg-emerald-50 px-2.5 py-1 text-xs font-semibold text-emerald-800">
                {{ track.status || 'MATCHED' }}
              </span>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
